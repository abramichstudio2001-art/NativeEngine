plugins {
    id 'com.android.application'
}

// Signing: set SIGNING_KEYSTORE / SIGNING_STORE_PASSWORD / SIGNING_KEY_ALIAS / SIGNING_KEY_PASSWORD
// (the GitHub workflow does this from repository secrets). Otherwise the bundled key in
// keystore/studybuddy.jks is used so every build can be installed over the previous one.
def ksFile = System.getenv('SIGNING_KEYSTORE') ?: rootProject.file('keystore/studybuddy.jks').path
def ksPass = System.getenv('SIGNING_STORE_PASSWORD') ?: 'studybuddy'
def ksAlias = System.getenv('SIGNING_KEY_ALIAS') ?: 'studybuddy'
def keyPass = System.getenv('SIGNING_KEY_PASSWORD') ?: ksPass
def buildNumber = (System.getenv('BUILD_NUMBER') ?: '1') as int

android {
    namespace 'com.studybuddy.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.studybuddy.app'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "2.0.${buildNumber}"
    }

    signingConfigs {
        shared {
            storeFile file(ksFile)
            storePassword ksPass
            keyAlias ksAlias
            keyPassword keyPass
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
